name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          # Disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Remove existing firewall rule if present
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP port 3389
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389

          # Restart Remote Desktop service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()

          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Remove old RDP user if it exists
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Remove-LocalUser -Name "RDP"
          }

          # Create user
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires:$true

          # Add to Administrators
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"

          # Add to Remote Desktop Users
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          # Save credentials for later steps
          echo "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

          # Verify user creation
          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

          Write-Host "RDP user created successfully."

      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          # Safely create the temporary installer path
          $installerPath = Join-Path $env:TEMP "tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Write-Host "Installer path: $installerPath"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer was not downloaded."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          # Verify installation
          $tailscaleExe = Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed successfully."

          # Remove installer
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tailscaleExe = Join-Path ${env:ProgramFiles} "Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
              Write-Error "Tailscale executable not found: $tailscaleExe"
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscaleExe up `
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" `
            --hostname="gh-runner-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          # Wait for Tailscale IPv4 address
          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 12) {

              $tsIP = & $tailscaleExe ip -4 2>$null

              if ($tsIP) {
                  $tsIP = $tsIP.Trim()
              }

              if (-not $tsIP) {
                  Write-Host "Waiting for Tailscale IP..."
                  Start-Sleep -Seconds 5
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }

          Write-Host "Tailscale IPv4: $tsIP"

          # Save IP for later steps
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Write-Host "Testing RDP port 3389..."

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "           RDP ACCESS INFORMATION"
          Write-Host "=========================================="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_CREDS"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "RDP session is active."
          Write-Host "The runner will remain active until the workflow is cancelled."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
